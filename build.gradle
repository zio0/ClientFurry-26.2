buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "com.guardsquare:proguard-gradle:7.9.1"
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def bundledModsDir = file("bundled-mods")
def bundledModJars = bundledModsDir.exists()
        ? bundledModsDir.listFiles().findAll { it.isFile() && it.name.endsWith(".jar") }.sort { it.name }
        : []
def baritoneModJar = bundledModJars.find { it.name.startsWith("baritone-fabric-") }
def bundledModsJson = groovy.json.JsonOutput.toJson(
        bundledModJars.collect { [file: "META-INF/jars/${it.name}"] }
)


repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

loom {
    accessWidenerPath = file("src/main/resources/furryhook.accesswidener")
    mods {
        "furryhook" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            programArg("--username")
            programArg("nekit")

            // Бэкенд больше не прибит гвоздями к vulkan. Восемь hs_err за один день, все с
            // одинаковой подписью: куча закоммичена на ~1 ГБ из трёх, а commit charge процесса
            // 51-56 ГБ и файл подкачки выжран до нуля (AvailPageFile 0-5 МБ из 64 ГБ). Это
            // течёт не куча и не прямые буферы - MaxDirectMemorySize их держит, - а нативные
            // аллокации графического стека: ~40 МБ в секунду, краш стабильно на 15-44 минуте.
            //
            // Стек там весь свежий: бэкенд Vulkan в 26.2, Sodium 0.9.1-beta.3, ImmediatelyFast
            // поверх. Предыдущая попытка лечила это сжатием кучи с 4G до 3G - подпись после
            // этого не изменилась ни на грамм, потому что куча тут вообще ни при чём.
            //
            // Запустить обратно на Vulkan для сравнения: gradlew runClient -PgraphicsBackend=vulkan
            String backend = project.findProperty("graphicsBackend")
            if (backend != null) {
                programArg("--graphicsBackend")
                programArg(backend.toString())
            }

            // Куча поднята обратно: 3G не хватало по-настоящему. Краш 16:23 - честный
            // "OutOfMemoryError: Java heap space" в тике мира, с кэшем чанков Baritone и
            // встроенным сервером на 108 модах. 6G из 16 ГБ - потолок, до которого рабочий
            // набор процесса (пик 10.5 ГБ) не упирается в физическую память.
            vmArg("-Xms1G")
            vmArg("-Xmx6G")
            // Метапространство резервировало 1.2 ГБ при 200 МБ использования.
            vmArg("-XX:MaxMetaspaceSize=512M")
            vmArg("-XX:ReservedCodeCacheSize=256M")
            vmArg("-XX:MaxDirectMemorySize=2G")
            // G1 по умолчанию не отдаёт освобождённую кучу обратно системе, пока идёт нагрузка.
            // Периодическая конкурентная сборка раскоммичивает регионы в простое.
            vmArg("-XX:+G1PeriodicGCInvokesConcurrent")
            vmArg("-XX:G1PeriodicGCInterval=30000")
            // Следующий OOM по куче оставит после себя дамп, а не только стектрейс.
            // По нативному OOM он не пишется - девять hs_err подряд и ни одного .hprof
            // рядом с ними, потому что куча в момент падения была наполовину пустая.
            vmArg("-XX:+HeapDumpOnOutOfMemoryError")
            vmArg("-XX:HeapDumpPath=run/heapdump.hprof")

            // Вот чего не хватало все девять раз. NMT учитывает нативные аллокации самой
            // JVM - метапространство, стеки потоков, GC, код, internal, - и при падении
            // печатает разбивку прямо в hs_err. Ответ он даёт в любую сторону:
            //
            //   таблица показывает десятки ГБ  -> течёт внутри JVM, и видно в каком ведре;
            //   таблица показывает 2-3 ГБ      -> внутри JVM всё чисто, а 52 ГБ commit
            //                                     charge сидят в драйвере GL, мимо учёта JVM.
            //
            // Второй исход - это не пустой результат, а именно тот, который снимает с
            // furryhook и с кучи все подозрения окончательно.
            vmArg("-XX:NativeMemoryTracking=summary")
            vmArg("-XX:+UnlockDiagnosticVMOptions")
            vmArg("-XX:+PrintNMTStatistics")
        }
    }
}


dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include implementation("com.github.weisj:jsvg:2.1.0")

    // Бисект нативной течи одной командой вместо перекладывания jar-ников руками:
    //   gradlew runClient -PwithoutGraphicsMods
    // снимает с рантайма весь рендер-стек (Sodium и его спутники, ImmediatelyFast,
    // EntityCulling, WaveyCapes). Если после этого commit charge за полчаса не уезжает
    // за 50 ГБ - течёт не клиент, и дальше искать надо в них, а не в furryhook.
    def graphicsModPrefixes = [
            "sodium-fabric-",
            "sodium-extra-fabric-",
            "reeses-sodium-options-fabric-",
            "ImmediatelyFast-Fabric-",
            "entityculling-fabric-",
            "waveycapes-fabric-"
    ]
    def dropGraphicsMods = project.hasProperty("withoutGraphicsMods")

    // The control run nobody has done yet:
    //   gradlew runClient -PwithoutMods
    // strips every bundled jar, leaving Minecraft, Fabric API and furryhook alone. Three fixes have
    // now gone in aimed at the client's own rendering and the leak has not moved - 128 MB/s before
    // them, 107 MB/s after, the same number twice. That is what a wrong suspect looks like. This
    // splits the question in one launch: still leaking on a bare install means the cause is
    // furryhook or Minecraft 26.2 itself, and everything measured so far says it is not furryhook.
    def dropAllMods = project.hasProperty("withoutMods")

    bundledModJars.each { bundledModJar ->
        if (dropAllMods) {
            logger.lifecycle("runClient: mod excluded -> ${bundledModJar.name}")
            return
        }
        if (dropGraphicsMods && graphicsModPrefixes.any { bundledModJar.name.startsWith(it) }) {
            logger.lifecycle("runClient: graphics mod excluded -> ${bundledModJar.name}")
            return
        }
        localRuntime(files(bundledModJar))
    }
    if (baritoneModJar != null) {
        compileOnly(files(baritoneModJar))
    }

    compileOnly "org.projectlombok:lombok:1.18.46"
    annotationProcessor "org.projectlombok:lombok:1.18.46"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "bundled_mods_json", bundledModsJson
    filteringCharset "UTF-8"

    // Local copies keep the execution-time closures configuration-cache safe
    // (no 'project' access during the execution phase).
    def modVersion = project.version.toString()
    def minecraftVersion = project.minecraft_version.toString()
    def loaderVersion = project.loader_version.toString()
    filesMatching("fabric.mod.json") {
        expand "version": modVersion,
                "minecraft_version": minecraftVersion,
                "loader_version": loaderVersion
    }

    // The source fabric.mod.json stays valid JSON ("jars": []); the real
    // bundled jar list is injected into the processed output here.
    def resolvedBundledModsJson = bundledModsJson
    doLast { task ->
        def modJsonFile = new File(task.destinationDir, "fabric.mod.json")
        if (modJsonFile.exists()) {
            def slurper = new groovy.json.JsonSlurper()
            def modJson = slurper.parse(modJsonFile, "UTF-8")
            modJson.jars = slurper.parseText(resolvedBundledModsJson)
            modJsonFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(modJson)), "UTF-8")
        }
    }
}

// Offline GLSL validation of the bundled shaders; skipped when glslang is not installed.
tasks.register("validateShaders", Exec) {
    group = "verification"
    description = "Validates furryhook shaders with glslang (skipped if glslang is not on PATH)."
    inputs.dir("src/main/resources/assets/furryhook/shaders")
    inputs.file("scripts/validate_shaders.py")
    commandLine "python3", "scripts/validate_shaders.py"
    onlyIf {
        def path = System.getenv("PATH") ?: ""
        path.split(File.pathSeparator).any { dir ->
            new File(dir, "glslang").canExecute() || new File(dir, "glslang.exe").canExecute()
        }
    }
}

tasks.named("check") {
    dependsOn "validateShaders"
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        into "META-INF"
        rename { "LICENSE_${project.archives_base_name}.txt" }
    }
    from("third-party/baritone") {
        include "LICENSE-LGPL-3.0.txt", "SOURCE.md"
        into "META-INF/licenses/baritone"
    }

    if (!bundledModJars.isEmpty()) {
        from(bundledModJars) {
            into "META-INF/jars"
        }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}